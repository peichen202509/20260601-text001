<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄鐘計時器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f3ee;
            --accent-color: #6b7fa3;
            --text-color: #4a4a4a;
            --white: #ffffff;
            --break-color: #8eb09b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        #status-label {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-color);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #timer-display {
            font-size: 10rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 2.5rem;
            font-variant-numeric: tabular-nums;
            user-select: none;
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        button {
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid var(--accent-color);
            background-color: transparent;
            color: var(--accent-color);
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--white);
        }

        button:active {
            transform: translateY(1px);
        }

        #btn-start {
            background-color: var(--accent-color);
            color: var(--white);
        }

        #round-count {
            font-size: 1.1rem;
            font-weight: 400;
            color: #888;
        }

        /* 響應式微調 */
        @media (max-width: 480px) {
            #timer-display {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="status-label">準備開始</div>
        <div id="timer-display">25:00</div>
        
        <div class="controls">
            <button id="btn-start">開始</button>
            <button id="btn-reset">重置</button>
        </div>

        <div id="round-count">今日已完成 0 輪</div>
    </div>

    <script>
        // 設定時間（秒）
        const TIME_CONFIG = {
            WORK: 25 * 60,
            SHORT_BREAK: 5 * 60,
            LONG_BREAK: 15 * 60
        };

        let timeLeft = TIME_CONFIG.WORK;
        let timerInterval = null;
        let isRunning = false;
        let currentMode = 'WORK'; // 'WORK', 'BREAK'
        let completedRounds = 0;

        const labelEl = document.getElementById('status-label');
        const timerEl = document.getElementById('timer-display');
        const startBtn = document.getElementById('btn-start');
        const resetBtn = document.getElementById('btn-reset');
        const roundsEl = document.getElementById('round-count');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            timerEl.textContent = timeStr;
            document.title = `(${timeStr}) 番茄鐘`;

            if (currentMode === 'WORK') {
                labelEl.textContent = '工作中';
                labelEl.style.color = 'var(--accent-color)';
            } else {
                labelEl.textContent = '休息中';
                labelEl.style.color = 'var(--break-color)';
            }
        }

        function switchMode() {
            if (currentMode === 'WORK') {
                completedRounds++;
                roundsEl.textContent = `今日已完成 ${completedRounds} 輪`;
                
                // 每 4 輪一次長休息
                if (completedRounds % 4 === 0) {
                    currentMode = 'BREAK';
                    timeLeft = TIME_CONFIG.LONG_BREAK;
                } else {
                    currentMode = 'BREAK';
                    timeLeft = TIME_CONFIG.SHORT_BREAK;
                }
            } else {
                currentMode = 'WORK';
                timeLeft = TIME_CONFIG.WORK;
            }
            updateDisplay();
            // 自動開始下一段
            startTimer();
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                switchMode();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startBtn.textContent = '暫停';
            timerInterval = setInterval(tick, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            startBtn.textContent = '繼續';
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            pauseTimer();
            currentMode = 'WORK';
            timeLeft = TIME_CONFIG.WORK;
            startBtn.textContent = '開始';
            labelEl.textContent = '準備開始';
            updateDisplay();
        }

        // 事件監聽
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // 空白鍵控制
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止網頁捲動
                toggleTimer();
            }
        });

        // 初始化顯示
        updateDisplay();
        labelEl.textContent = '準備開始';
    </script>
</body>
</html>
